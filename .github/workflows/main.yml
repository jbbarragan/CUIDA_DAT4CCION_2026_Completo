name: Publicar CUIDA en GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Localizar y ejecutar build_dashboard.py
        run: |
          SCRIPT=$(find . -name build_dashboard.py -not -path "./.git/*" | head -n 1)
          echo "Script encontrado: $SCRIPT"
          test -n "$SCRIPT"
          DIR=$(dirname "$SCRIPT")
          cd "$DIR"
          python build_dashboard.py
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Verificar el HTML generado
        run: |
          echo "Directorio: $APP_DIR"
          ls -la "$APP_DIR/dist"
          echo "Coincidencias del encabezado viejo (debe ser 0):"
          grep -c "<header" "$APP_DIR/dist/index.html" || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
